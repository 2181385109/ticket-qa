[pytest]
# 根目录是 tests/:api/ 和 security/ 共用 tests/conftest.py 里的 fixture 和 api/framework 里的封装
testpaths = api security
pythonpath = api
python_files = test_*.py
# --strict-markers:用了没登记的 marker 直接报错,防止 @pytest.mark.circuti 这种拼错后静默失效
# -ra:结尾汇总所有非 passed 的用例(xfail / error 等),CI 日志里一眼看到
# -p no:cacheprovider:不写 .pytest_cache,CI 里没用
addopts = -ra --strict-markers --alluredir=allure-results --clean-alluredir -p no:cacheprovider
markers =
    smoke: 冒烟——服务起来后先跑的一小撮
    llm: 走 LLM 挡板路径的用例
    circuit: 会把熔断器打开 60 秒的用例,conftest 会把它们排到最后
    slow: 单条超过 3 秒(超时降级、熔断恢复等待)
    security: 安全用例(tests/security)
    db: 需要直连 MySQL 做断言或造数
    mq: 需要 RabbitMQ 管理 API
    known_issue: 已知问题,xfail(strict) 挂着,修复后会以 XPASS 失败提醒更新 findings
    concurrency: 多线程同时打同一张工单的用例(竞态回归门禁),前置连接池预热
    capacity: 容量 / 积压类用例(MQ 生产 > 消费、SLA 到期高峰、池满时消费者饥饿),单条 10~60 秒
    fault: docker compose stop 中间件的故障注入用例,排到整个会话最后;需要 DOCKER_COMPOSE_CMD
log_cli = false
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
